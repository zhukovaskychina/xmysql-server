[mysqld]
user = xmysql
bind-address = 127.0.0.1
port = 3326
datadir = data/jdbc-performance-compat-3
dev_bypass_password_auth = false
max_session_number = 1000
session_timeout = 60s
fail_fast_timeout = 5s

[innodb]
data_dir = data/jdbc-performance-compat-3
redo_log_dir = data/jdbc-performance-compat-3/redo
undo_log_dir = data/jdbc-performance-compat-3/undo
buffer_pool_size = 64M

[session]
compress_encoding = false
tcp_no_delay = true
tcp_keep_alive = true
keep_alive_period = 180s
pkg_rq_size = 1024
pkg_wq_size = 1024
tcp_read_timeout = 1s
tcp_write_timeout = 5s
wait_timeout = 7s
max_msg_len = 16777216
session_name = xmysql-jdbc-performance

[logs]
log_error = reports/compatibility/jdbc-performance/error.log
log_infos = reports/compatibility/jdbc-performance/mysql.log
log_level = warn
