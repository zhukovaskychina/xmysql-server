[mysqld]
user = xmysql
bind-address = 127.0.0.1
port = 3312
datadir = data/external-crash-compat
dev_bypass_password_auth = true
max_session_number = 100
session_timeout = 60s
fail_fast_timeout = 5s

[innodb]
data_dir = data/external-crash-compat
redo_log_dir = data/external-crash-compat/redo
undo_log_dir = data/external-crash-compat/undo
buffer_pool_size = 64M

[session]
compress_encoding = false
tcp_no_delay = true
tcp_keep_alive = true
keep_alive_period = 180s
pkg_rq_size = 1024
pkg_wq_size = 1024
tcp_read_timeout = 1s
tcp_write_timeout = 5s
wait_timeout = 7s
max_msg_len = 16777216
session_name = xmysql-external-crash

[logs]
log_error = reports/compatibility/external-crash/error.log
log_infos = reports/compatibility/external-crash/mysql.log
log_level = warn
