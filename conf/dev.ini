# Local development config: port 3309, bypass auth
[mysqld]
user        = xmysql
bind-address = 127.0.0.1
port        = 3309
basedir     = .
datadir     = server/net/data
tmpdir      = D:\tmp
lc-messages-dir = .
max_session_number = 1000
session_timeout = 60s
fail_fast_timeout = 5s
dev_bypass_password_auth = true

[innodb]
data_dir = server/net/data
data_file_path = ibdata1:100M:autoextend
buffer_pool_size = 134217728
page_size = 16384
redo_log_dir = redo
undo_log_dir = undo
log_file_size = 50331648
log_buffer_size = 16777216
flush_log_at_trx_commit = 1
file_format = Barracuda
default_row_format = DYNAMIC
doublewrite = 1
adaptive_hash_index = 1

[session]
compress_encoding = false
tcp_no_delay = true
tcp_keep_alive = true
keep_alive_period = 180s
tcp_r_buf_size = 262144
tcp_w_buf_size = 65536
pkg_rq_size = 1024
pkg_wq_size = 1024
tcp_read_timeout = 1s
tcp_write_timeout = 5s
wait_timeout = 7s
max_msg_len = 16777216
session_name = xmysql-server

[logs]
log_error = tmp/jdbc_logs/error.log
log_infos = tmp/jdbc_logs/mysql.log
log_level = info
