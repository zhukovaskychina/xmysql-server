name: P0 Evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Evidence mode to run"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - full
          - candidate
          - governance
      recovery_runs:
        description: "Crash recovery replay runs for full mode"
        required: true
        type: number
        default: 3
      concurrency_runs:
        description: "Concurrency validation runs for full mode"
        required: true
        type: number
        default: 1
      rollback_window_seconds:
        description: "Rollback timing window for candidate mode"
        required: true
        type: number
        default: 300
      owner_signoff_json:
        description: "Optional owner signoff JSON path inside the repository workspace"
        required: false
        default: ""
      accepted_deferrals_json:
        description: "Optional accepted delivery deferrals JSON path inside the repository workspace"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: p0-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p0-evidence:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        shell: pwsh
        run: go version

      - name: Run P0 tooling preflight
        if: ${{ inputs.mode == 'preflight' }}
        shell: pwsh
        run: ./scripts/verify_p0_tooling_preflight.ps1

      - name: Run full P0 evidence suite
        if: ${{ inputs.mode == 'full' }}
        shell: pwsh
        env:
          RECOVERY_RUNS: ${{ inputs.recovery_runs }}
          CONCURRENCY_RUNS: ${{ inputs.concurrency_runs }}
        run: |
          $recoveryRuns = [int]$env:RECOVERY_RUNS
          $concurrencyRuns = [int]$env:CONCURRENCY_RUNS
          ./scripts/run_p0_evidence_suite.ps1 `
            -RecoveryRuns $recoveryRuns `
            -ConcurrencyRuns $concurrencyRuns

      - name: Run P0 delivery candidate
        if: ${{ inputs.mode == 'candidate' }}
        shell: pwsh
        env:
          RECOVERY_RUNS: ${{ inputs.recovery_runs }}
          CONCURRENCY_RUNS: ${{ inputs.concurrency_runs }}
          ROLLBACK_WINDOW_SECONDS: ${{ inputs.rollback_window_seconds }}
          ACCEPTED_DEFERRALS_JSON: ${{ inputs.accepted_deferrals_json }}
          OWNER_SIGNOFF_JSON: ${{ inputs.owner_signoff_json }}
        run: |
          $recoveryRuns = [int]$env:RECOVERY_RUNS
          $concurrencyRuns = [int]$env:CONCURRENCY_RUNS
          $rollbackWindowSeconds = [int]$env:ROLLBACK_WINDOW_SECONDS
          $candidateArgs = @(
            "-RecoveryRuns", $recoveryRuns,
            "-ConcurrencyRuns", $concurrencyRuns,
            "-RollbackWindowSeconds", $rollbackWindowSeconds
          )
          if (-not [string]::IsNullOrWhiteSpace($env:ACCEPTED_DEFERRALS_JSON)) {
            $candidateArgs += @("-AcceptedDeferralsJson", $env:ACCEPTED_DEFERRALS_JSON)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:OWNER_SIGNOFF_JSON)) {
            $candidateArgs += @("-OwnerSignoffJson", $env:OWNER_SIGNOFF_JSON)
          }
          ./scripts/run_p0_delivery_candidate.ps1 `
            @candidateArgs

      - name: Run P0 governance gate
        if: ${{ inputs.mode == 'governance' }}
        shell: pwsh
        env:
          ACCEPTED_DEFERRALS_JSON: ${{ inputs.accepted_deferrals_json }}
          OWNER_SIGNOFF_JSON: ${{ inputs.owner_signoff_json }}
        run: |
          $governanceArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:ACCEPTED_DEFERRALS_JSON)) {
            $governanceArgs += @("-AcceptedDeferralsJson", $env:ACCEPTED_DEFERRALS_JSON)
          }
          if (-not [string]::IsNullOrWhiteSpace($env:OWNER_SIGNOFF_JSON)) {
            $governanceArgs += @("-OwnerSignoffJson", $env:OWNER_SIGNOFF_JSON, "-RequireOwnerSignoff")
          }
          ./scripts/verify_p0_governance_gate.ps1 @governanceArgs

      - name: Upload P0 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-evidence-reports-${{ inputs.mode }}
          path: reports/**
          if-no-files-found: warn
