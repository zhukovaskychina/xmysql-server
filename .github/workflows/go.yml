name: Go CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go packages
        shell: bash
        run: |
          packages="$(go list ./... | grep -vE '/(cmd|client)(/|$)')"
          if [[ -z "$packages" ]]; then
            echo "No Go packages selected for build" >&2
            exit 1
          fi
          go build -v $packages

      - name: Test Go packages
        shell: bash
        run: |
          packages="$(go list ./... | grep -vE '/(cmd|client)(/|$)')"
          if [[ -z "$packages" ]]; then
            echo "No Go packages selected for tests" >&2
            exit 1
          fi
          go test -v $packages
