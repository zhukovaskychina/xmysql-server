groups:
  - name: xmysql-p0
    rules:
      - alert: XMySQLHighErrorRate
        expr: rate(xmysql_query_errors_total[5m]) / clamp_min(rate(xmysql_queries_total[5m]), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: XMySQL query error rate is high
          description: Query error rate has exceeded 5% for 5 minutes.

      - alert: XMySQLHighP99Latency
        expr: histogram_quantile(0.99, rate(xmysql_query_latency_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: XMySQL P99 query latency is high
          description: P99 query latency has exceeded 1000ms for 5 minutes.

      - alert: XMySQLLongTransaction
        expr: xmysql_long_transactions_active > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: XMySQL long transaction detected
          description: One or more long transactions have remained active beyond the configured threshold.

      - alert: XMySQLRecoveryFailure
        expr: increase(xmysql_recovery_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: XMySQL recovery failure detected
          description: Crash recovery failure counter increased.

      - alert: XMySQLCheckpointDirtyPagesHigh
        expr: xmysql_checkpoint_dirty_pages > 100000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: XMySQL checkpoint dirty pages are high
          description: Dirty page count has exceeded the P0 warning threshold.

      - alert: XMySQLLockWaitSpike
        expr: rate(xmysql_lock_waits_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: XMySQL lock wait spike detected
          description: Lock wait rate has exceeded the P0 warning threshold.
